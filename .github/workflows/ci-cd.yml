name: CI/CD Pipeline to Docker Hub and Render

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/render-deploy:latest
          # Pass credentials directly to the build-push builder container:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Use local docker config context auth for buildx
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
          # Pass the auth configuration explicitly via secrets or registry token
          secret-envs: |
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}